  <style>
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 24px;
      text-align: left;
    }

    .project-item {
      margin-bottom: 16px;
      padding: 0;
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }

    .project-demo-image {
      width: 120px;
      height: 80px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #e5e7eb;
    }

    .project-content {
      flex: 1;
    }

    .project-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    .project-title a {
      font-size: 16px;
    }

    .project-group:first-of-type .project-group-heading {
      margin-top: 0;
    }

    .project-description {
      margin-bottom: 0;
      line-height: 1.6;
      color: #374151;
    }

    .project-list {
      list-style: none !important;
      padding-left: 0 !important;
      margin: 0 0 8px !important;
    }

    [data-theme="dark"] .page-title { color: var(--text-color); }
    [data-theme="dark"] .project-title { color: var(--text-color); }
    [data-theme="dark"] .project-description { color: var(--text-color); }
    [data-theme="dark"] .project-demo-image { border-color: #374151; }

    @media screen and (max-width: 768px) {
      .project-item {
        flex-direction: column;
        gap: 10px;
      }

      .project-demo-image {
        width: 100%;
        height: 120px;
      }
    }

<body>
  <div id="site-nav"></div>

  <main id="main-content" class="main-content-wrapper page-shell">
    <h1 class="page-title" data-lens-trigger>Projects</h1>

    <section class="project-group">
      <h2 class="project-group-heading">Research and developer tools</h2>
      <ul class="project-list" data-category="tools"></ul>
    </section>

    <section class="project-group">
      <h2 class="project-group-heading">Interactive experiments</h2>
      <ul class="project-list" data-category="experiments"></ul>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Load JavaScript files -->
  <script src="site-shell.js?v=lenses-v3"></script>
  <script src="utils.js"></script>
  <!-- Load data first, then populate projects -->
  <script src="data.js"></script>
  <script>
    // Projects page specific script
    document.addEventListener('DOMContentLoaded', function() {
      populateProjectGroups(getAllProjects());
      initializeDarkMode();
      initializeBackToTop();
    });

    /**
     * Render every project into the list for its category ("tools" or "experiments").
     * The name and the thumbnail link to the project's homepage (project.url).
     */
    function populateProjectGroups(projects) {
      projects.forEach(project => {
        const list = document.querySelector(`.project-list[data-category="${project.category}"]`);
        if (!list) return;
        const li = document.createElement('li');
        li.className = 'project-item';

        if (project.demoPath) {
          const imageLink = document.createElement('a');
          imageLink.href = project.url;
          imageLink.target = '_blank';
          imageLink.rel = 'noopener';
          imageLink.tabIndex = -1;   // the name link below is the keyboard target
          imageLink.setAttribute('aria-hidden', 'true');
          const img = document.createElement('img');
          img.src = project.demoPath;
          img.alt = '';
          img.className = 'project-demo-image';
          img.loading = 'lazy';
          imageLink.appendChild(img);
          li.appendChild(imageLink);
        }

        const content = document.createElement('div');
        content.className = 'project-content';
        content.innerHTML = `<div class="project-title"><a class="project-link" href="${project.url}" target="_blank" rel="noopener">${project.title}</a></div>`
          + `<div class="project-description">${project.description}</div>`;
        li.appendChild(content);
        list.appendChild(li);
      });
    }

    // Dark mode functions are loaded from utils.js
  </script>
</body>
